name: Bexorg
description: 'Bexorg, Inc. is a New Haven, Connecticut and San Francisco based digital-biology
  company building AI-powered drug-discovery infrastructure for central nervous system
  (CNS) therapies. Its BrainEx platform restores and sustains whole donated human brains
  to test drug candidates directly in human tissue, generating clinically predictive
  data on blood-brain-barrier delivery, target engagement, and brain exposure across
  small molecules, biologics, viral vectors, and lipid nanoparticles before human trials.
  Backed by Amplify Partners, Bexorg aims to reduce the high failure rate of CNS clinical
  trials. The company markets a scientific platform and does not currently publish a
  public API, SDK, or developer documentation surface.'
